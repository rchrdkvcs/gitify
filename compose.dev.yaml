services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3333:3333"
      - "5173:5173"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DB_HOST: database
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy

volumes:
  db_data:
  app_node_modules:
